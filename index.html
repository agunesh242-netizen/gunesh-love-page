<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gunesh ❤️ Pooja</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
cursor:none;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#140014,#2d0036,#4b004f);
position:relative;
}

/* Sparkle Cursor */

.sparkle{
position:absolute;
width:10px;
height:10px;
border-radius:50%;
background:white;
pointer-events:none;
animation:spark 1s linear forwards;
}

@keyframes spark{
0%{
transform:scale(1);
opacity:1;
}
100%{
transform:scale(0);
opacity:0;
}
}

/* Background Glow */

.bg{
position:absolute;
width:700px;
height:700px;
background:rgba(255,0,128,0.2);
border-radius:50%;
filter:blur(100px);
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{
transform:translate(-100px,-50px);
}
100%{
transform:translate(100px,50px);
}
}

/* Main Card */

.card{
position:relative;
width:380px;
padding:20px;
border-radius:35px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(20px);
box-shadow:0 0 40px rgba(255,0,128,0.4);
text-align:center;
z-index:10;
overflow:hidden;
}

/* Slideshow */

.slideshow{
position:relative;
width:100%;
height:500px;
overflow:hidden;
border-radius:25px;
border:4px solid white;
box-shadow:0 0 30px pink;
background:black;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
background:black;
opacity:0;
animation:slideShow 12s infinite;
}

.slide:nth-child(1){
animation-delay:0s;
}

.slide:nth-child(2){
animation-delay:4s;
}

.slide:nth-child(3){
animation-delay:8s;
}

@keyframes slideShow{
0%{
opacity:0;
}
10%{
opacity:1;
}
30%{
opacity:1;
}
40%{
opacity:0;
}
100%{
opacity:0;
}
}

/* Stylish Name */

.love-title{
margin-top:20px;
font-size:50px;
font-family:'Dancing Script',cursive;
font-weight:bold;
color:white;
text-shadow:
0 0 10px #fff,
0 0 20px #ff4da6,
0 0 40px #ff0080;
animation:glow 2s infinite alternate;
}

.love-title span{
display:inline-block;
animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
0%{
transform:scale(1);
}
25%{
transform:scale(1.3);
}
50%{
transform:scale(1);
}
75%{
transform:scale(1.3);
}
100%{
transform:scale(1);
}
}

@keyframes glow{
from{
filter:drop-shadow(0 0 5px #ff4da6);
}
to{
filter:drop-shadow(0 0 20px #ff99cc);
}
}

/* Typing Message */

.typing{
margin-top:18px;
font-size:18px;
color:white;
line-height:1.8;
min-height:120px;
padding:10px;
}

/* Button */

.gift-btn{
margin-top:20px;
padding:15px 30px;
border:none;
border-radius:50px;
background:linear-gradient(45deg,#ff0080,#ff4da6);
color:white;
font-size:20px;
cursor:pointer;
box-shadow:0 0 30px rgba(255,0,128,0.6);
transition:0.4s;
}

.gift-btn:hover{
transform:scale(1.1);
}

/* Popup */

.popup{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
background:rgba(20,0,20,0.95);
padding:35px;
border-radius:30px;
text-align:center;
width:330px;
transition:0.5s;
z-index:100;
box-shadow:0 0 60px rgba(255,0,128,0.5);
}

.popup.active{
transform:translate(-50%,-50%) scale(1);
}

.popup h2{
font-size:42px;
font-family:'Dancing Script',cursive;
color:#ff4da6;
margin-bottom:15px;
}

.popup p{
font-size:18px;
line-height:1.8;
color:white;
}

/* Proposal Ring */

.ring{
font-size:70px;
animation:ringGlow 1.5s infinite alternate;
}

@keyframes ringGlow{
from{
transform:scale(1);
filter:drop-shadow(0 0 10px gold);
}
to{
transform:scale(1.1);
filter:drop-shadow(0 0 25px gold);
}
}

/* Floating Hearts */

.heart{
position:absolute;
bottom:-50px;
color:#ff006e;
animation:float linear infinite;
opacity:0.8;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-110vh);
opacity:0;
}
}

/* Flower Rain */

.flower{
position:absolute;
top:-50px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-10vh) rotate(0deg);
}
100%{
transform:translateY(110vh) rotate(360deg);
}
}

/* Fireworks */

.firework{
position:absolute;
width:10px;
height:10px;
border-radius:50%;
animation:explode 1s ease-out infinite;
opacity:0;
}

@keyframes explode{
0%{
transform:scale(0);
opacity:1;
}
100%{
transform:scale(12);
opacity:0;
}
}

/* Angel */

.angel{
position:absolute;
top:20px;
right:20px;
font-size:80px;
animation:fly 4s ease-in-out infinite;
}

@keyframes fly{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-20px);
}
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="angel">👼</div>

<div class="card">

<!-- PHOTO SLIDESHOW -->

<div class="slideshow">

<img src="IMG_1763.jpeg" class="slide">
<img src="IMG_1763.jpeg" class="slide">
<img src="IMG_1763.jpeg" class="slide">

</div>

<!-- TITLE -->

<h1 class="love-title">
Gunesh <span>❤️</span> Pooja
</h1>

<!-- TYPING MESSAGE -->

<div class="typing" id="typing"></div>

<!-- BUTTON -->

<button class="gift-btn" onclick="openGift()">
💍 Open Forever Love
</button>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

<div class="ring">💍</div>

<h2>Forever Together</h2>

<p>
🌹 You are my destiny 🌹<br><br>

❤️ Every heartbeat of mine<br>
belongs only to you ❤️<br><br>

✨ Will you stay with me forever? ✨
</p>

</div>

<!-- MUSIC -->

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<script>

/* Start Music on First Tap */

document.body.addEventListener("click", function () {

const music = document.getElementById("bgMusic");

music.play();

}, { once:true });

/* Typing Effect */

const text = `
🌸 Every heartbeat whispers your name 💖

✨ You are my sweetest forever dream ✨

❤️ My happiness begins with you ❤️
`;

let i = 0;

function typingEffect(){

if(i < text.length){

document.getElementById("typing").innerHTML += text.charAt(i);

i++;

setTimeout(typingEffect,50);

}

}

typingEffect();

/* Popup */

function openGift(){

document.getElementById("popup").classList.add("active");

createFireworks();

}

/* Hearts */

for(let i=0;i<35;i++){

let heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*30)+"px";

heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);

}

/* Flower Rain */

let flowers=["🌸","🌺","🌷","💮","🌹"];

for(let i=0;i<70;i++){

let flower=document.createElement("div");

flower.classList.add("flower");

flower.innerHTML=flowers[Math.floor(Math.random()*flowers.length)];

flower.style.left=Math.random()*100+"vw";

flower.style.fontSize=(20+Math.random()*20)+"px";

flower.style.animationDuration=(5+Math.random()*10)+"s";

document.body.appendChild(flower);

}

/* Fireworks */

function createFireworks(){

for(let i=0;i<50;i++){

let firework=document.createElement("div");

firework.classList.add("firework");

firework.style.left=Math.random()*100+"vw";

firework.style.top=Math.random()*100+"vh";

firework.style.background=
`hsl(${Math.random()*360},100%,70%)`;

firework.style.animationDelay=
Math.random()*1+"s";

document.body.appendChild(firework);

setTimeout(()=>{
firework.remove();
},2000);

}

}

/* Sparkle Cursor */

document.addEventListener("mousemove",function(e){

let sparkle=document.createElement("div");

sparkle.classList.add("sparkle");

sparkle.style.left=e.pageX+"px";

sparkle.style.top=e.pageY+"px";

document.body.appendChild(sparkle);

setTimeout(()=>{
sparkle.remove();
},1000);

});

</script>

</body>
</html>
