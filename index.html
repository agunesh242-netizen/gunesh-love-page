<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gunesh ❤️ Pooja Love Story</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#240024,#4b004b,#120012);
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
position:relative;
color:white;
}

/* Background Glow */

.bg{
position:absolute;
width:700px;
height:700px;
background:rgba(255,0,128,0.25);
border-radius:50%;
filter:blur(120px);
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{
transform:translate(-100px,-50px);
}
100%{
transform:translate(100px,50px);
}
}

/* Book */

.book{
position:relative;
width:380px;
height:720px;
overflow:hidden;
border-radius:35px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(20px);
box-shadow:0 0 50px rgba(255,0,128,0.5);
z-index:10;
}

/* Pages */

.page{
position:absolute;
width:100%;
height:100%;
padding:20px;
display:none;
flex-direction:column;
justify-content:flex-start;
align-items:center;
text-align:center;
animation:fade 1s;
}

.page.active{
display:flex;
}

@keyframes fade{
from{
opacity:0;
transform:translateX(50px);
}
to{
opacity:1;
transform:translateX(0);
}
}

/* Image */

.page img{
width:100%;
height:430px;
object-fit:cover;
border-radius:25px;
border:4px solid white;
box-shadow:0 0 30px pink;
}

/* Title */

.title{
margin-top:18px;
font-size:42px;
font-family:'Dancing Script',cursive;
text-shadow:
0 0 10px #fff,
0 0 20px #ff4da6,
0 0 40px #ff0080;
}

.title span{
display:inline-block;
animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
0%{transform:scale(1);}
25%{transform:scale(1.25);}
50%{transform:scale(1);}
75%{transform:scale(1.25);}
100%{transform:scale(1);}
}

/* Message */

.message{
margin-top:15px;
font-size:18px;
line-height:1.8;
padding:10px;
}

/* Audio */

audio{
margin-top:10px;
width:100%;
}

/* Buttons */

.buttons{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 20px;
}

button{
padding:12px 22px;
border:none;
border-radius:50px;
background:linear-gradient(45deg,#ff0080,#ff4da6);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 20px rgba(255,0,128,0.5);
transition:0.4s;
}

button:hover{
transform:scale(1.08);
}

/* Floating Hearts */

.heart{
position:absolute;
bottom:-50px;
color:#ff006e;
animation:float linear infinite;
opacity:0.8;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-110vh);
opacity:0;
}
}

/* Flowers */

.flower{
position:absolute;
top:-50px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-10vh) rotate(0deg);
}
100%{
transform:translateY(110vh) rotate(360deg);
}
}

/* Fireworks */

.firework{
position:absolute;
width:10px;
height:10px;
border-radius:50%;
animation:explode 1s ease-out infinite;
opacity:0;
}

@keyframes explode{
0%{
transform:scale(0);
opacity:1;
}
100%{
transform:scale(12);
opacity:0;
}
}

/* Angel */

.angel{
position:absolute;
top:20px;
right:20px;
font-size:70px;
animation:fly 4s ease-in-out infinite;
}

@keyframes fly{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-20px);
}
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="angel">👼</div>

<div class="book">

<!-- PAGE 1 -->

<div class="page active">

<img src="IMG_0392.jpeg">

<h1 class="title">
First <span>❤️</span> Meeting
</h1>

<div class="message">
🌸 The day our eyes met,<br>
my heart found its favorite person 💖
</div>

</div>

<!-- PAGE 2 -->

<div class="page">

<img src="IMG_0504.jpeg">

<h1 class="title">
Wedding <span>💍</span> Day
</h1>

<div class="message">
✨ Two souls, one promise,<br>
one beautiful forever ❤️
</div>

</div>

<!-- PAGE 3 -->

<div class="page">

<img src="IMG_7345.jpeg">

<h1 class="title">
Honeymoon <span>🌸</span>
</h1>

<div class="message">
🌹 Every journey becomes magical<br>
when I’m with you 💞
</div>

</div>

<!-- PAGE 4 -->

<div class="page">

<img src="d2f6d002-8ccf-48d8-a882-192618f10d14.jpeg">

<h1 class="title">
Forever <span>❤️</span> Together
</h1>

<div class="message">
💖 No matter what happens,<br>
my heart will always belong to you ✨
</div>

</div>

<!-- MUSIC -->

<audio id="bgMusic" controls autoplay loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<!-- BUTTONS -->

<div class="buttons">

<button onclick="prevPage()">⬅ Prev</button>

<button onclick="nextPage()">Next ➡</button>

</div>

</div>

<script>

/* MUSIC */

document.body.addEventListener("click", function(){

document.getElementById("bgMusic").play();

},{once:true});

/* PAGE SYSTEM */

let pages=document.querySelectorAll(".page");

let current=0;

function showPage(index){

pages.forEach(page=>page.classList.remove("active"));

pages[index].classList.add("active");

createFireworks();

}

function nextPage(){

current++;

if(current>=pages.length){
current=0;
}

showPage(current);

}

function prevPage(){

current--;

if(current<0){
current=pages.length-1;
}

showPage(current);

}

/* HEARTS */

for(let i=0;i<35;i++){

let heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*30)+"px";

heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);

}

/* FLOWERS */

let flowers=["🌸","🌺","🌷","💮","🌹"];

for(let i=0;i<60;i++){

let flower=document.createElement("div");

flower.classList.add("flower");

flower.innerHTML=flowers[Math.floor(Math.random()*flowers.length)];

flower.style.left=Math.random()*100+"vw";

flower.style.fontSize=(20+Math.random()*20)+"px";

flower.style.animationDuration=(5+Math.random()*10)+"s";

document.body.appendChild(flower);

}

/* FIREWORKS */

function createFireworks(){

for(let i=0;i<30;i++){

let firework=document.createElement("div");

firework.classList.add("firework");

firework.style.left=Math.random()*100+"vw";

firework.style.top=Math.random()*100+"vh";

firework.style.background=
`hsl(${Math.random()*360},100%,70%)`;

document.body.appendChild(firework);

setTimeout(()=>{
firework.remove();
},2000);

}

}

</script>

</body>
</html>
