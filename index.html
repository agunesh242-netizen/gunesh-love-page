<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌹 Gunesh ❤️ Pooja 🌹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a0024, #2d003d, #1a0024);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 60px rgba(255, 20, 147, 0.3);
            animation: cardGlow 2s ease-in-out infinite alternate;
            max-width: 95%;
            width: 500px;
        }

        @keyframes cardGlow {
            0% {
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 60px rgba(255, 20, 147, 0.3);
            }
            100% {
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 100px rgba(255, 20, 147, 0.7), 0 0 150px rgba(255, 105, 180, 0.5);
            }
        }

        .heart-icon {
            font-size: 70px;
            animation: heartbeat 1.2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.3);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.2);
            }
            60% {
                transform: scale(1);
            }
        }

        .names-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .name {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.8), 0 0 40px rgba(255, 105, 180, 0.6);
            letter-spacing: 3px;
        }

        .name-hindi {
            font-size: 1.4rem;
            color: #ffb6c1;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .love-symbol {
            font-size: 2.5rem;
            animation: heartbeat 1.2s ease-in-out infinite;
            color: #ff1493;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.9);
        }

        .title {
            font-size: 2rem;
            color: #fff;
            margin: 15px 0;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.8), 0 0 40px rgba(255, 105, 180, 0.6);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .message {
            font-size: 1.3rem;
            color: #ffb6c1;
            line-height: 1.8;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(255, 192, 203, 0.5);
        }

        .hindi-message {
            font-size: 1.5rem;
            color: #ff69b4;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
            line-height: 2;
        }

        .name-footer {
            font-size: 1.4rem;
            color: #ffb6c1;
            margin-top: 20px;
            font-style: italic;
            text-shadow: 0 0 10px rgba(255, 192, 203, 0.5);
        }

        .flower-emoji {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            font-size: 30px;
            animation: fall linear forwards;
            filter: drop-shadow(0 0 10px rgba(255, 192, 203, 0.8));
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.5);
                opacity: 1;
            }
            20% {
                transform: translateY(20vh) rotate(90deg) scale(1);
                opacity: 1;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 4;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px #ff69b4, 0 0 30px #ff1493, 0 0 45px #ff69b4;
            animation: sparkleFall linear forwards;
        }

        @keyframes sparkleFall {
            0% {
                transform: translateY(-5vh) scale(0);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) scale(1);
                opacity: 0;
            }
        }

        .hearts-bg {
            position: fixed;
            pointer-events: none;
            z-index: 3;
            font-size: 24px;
            animation: floatUp linear infinite;
            opacity: 0.4;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(110vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        .btn {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.7);
        }

        .btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .name {
                font-size: 1.6rem;
            }
            .name-hindi {
                font-size: 1.1rem;
            }
            .title {
                font-size: 1.5rem;
            }
            .message {
                font-size: 1.1rem;
            }
            .hindi-message {
                font-size: 1.3rem;
            }
            .message-card {
                padding: 30px 20px;
            }
            .names-container {
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Message Card -->
    <div class="message-card">
        <div class="heart-icon">💖</div>

        <!-- Names with Love -->
        <div class="names-container">
            <div>
                <div class="name">GUNESH</div>
                <div class="name-hindi">गुनेश</div>
            </div>
            <div class="love-symbol">❤️</div>
            <div>
                <div class="name">POOJA</div>
                <div class="name-hindi">पूजा</div>
            </div>
        </div>

        <h1 class="title">I Love You Pooja</h1>
        <p class="message">You are the most beautiful part of my life...</p>
        <p class="hindi-message">
            तुम मेरी ज़िंदगी का<br>सबसे खूबसूरत हिस्सा हो 🌸
        </p>
        <p class="name-footer">- तुम्हारा गुनेश ❤️</p>
        <button class="btn" onclick="sendMoreLove()">💝 और प्यार भेजो 💝</button>
    </div>

    <script>
        // 🌸 Falling Flowers Animation
        const flowerEmojis = ['🌸', '🌺', '🌷', '🌹', '💐', '🌻', '🌼', '🪷', '💮', '🏵️', '🌾', '🍁', '💖', '✨'];

        // Special name flowers
        function createNameFlower() {
            const nameEmojis = ['G', 'P', '❤️', 'G❤️P', '💑', '💏', '💕'];
            const flower = document.createElement('div');
            flower.classList.add('flower-emoji');
            const allEmojis = [...flowerEmojis, ...nameEmojis];
            flower.textContent = allEmojis[Math.floor(Math.random() * allEmojis.length)];
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.top = '-40px';
            flower.style.fontSize = (Math.random() * 35 + 20) + 'px';
            flower.style.animationDuration = (Math.random() * 5 + 5) + 's';
            flower.style.animationDelay = Math.random() * 0.5 + 's';
            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, (parseFloat(flower.style.animationDuration) + 0.5) * 1000);
        }

        function createFlower() {
            const flower = document.createElement('div');
            flower.classList.add('flower-emoji');
            flower.textContent = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.top = '-40px';
            flower.style.fontSize = (Math.random() * 35 + 20) + 'px';
            flower.style.animationDuration = (Math.random() * 5 + 5) + 's';
            flower.style.animationDelay = Math.random() * 0.5 + 's';
            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, (parseFloat(flower.style.animationDuration) + 0.5) * 1000);
        }

        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.top = '-10px';
            sparkle.style.width = (Math.random() * 8 + 3) + 'px';
            sparkle.style.height = sparkle.style.width;
            sparkle.style.animationDuration = (Math.random() * 4 + 3) + 's';
            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, (parseFloat(sparkle.style.animationDuration) + 0.5) * 1000);
        }

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.classList.add('hearts-bg');
            heart.textContent = ['💕', '💗', '💓', '💞', '💖', '💘', '💝', '❤️', 'G❤️P'][Math.floor(Math.random() * 9)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 10 + 8) + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, (parseFloat(heart.style.animationDuration) + 0.5) * 1000);
        }

        function sendMoreLove() {
            // Burst of flowers with names
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    createNameFlower();
                    createSparkle();
                }, i * 50);
            }

            // Burst of hearts from center with names
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('flower-emoji');
                    heart.textContent = ['G❤️P', '💖', '💝', '💕', '❤️', 'गुनेश', 'पूजा'][Math.floor(Math.random() * 7)];
                    heart.style.left = (35 + Math.random() * 30) + 'vw';
                    heart.style.top = '40vh';
                    heart.style.fontSize = (Math.random() * 40 + 20) + 'px';
                    heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 4000);
                }, i * 30);
            }
        }

        // Start animations
        setInterval(createFlower, 300);
        setInterval(createNameFlower, 800); // Special name flowers occasionally
        setInterval(createSparkle, 200);
        setInterval(createFloatingHeart, 600);

        // Initial burst
        for (let i = 0; i < 25; i++) {
            setTimeout(createFlower, i * 80);
        }
        for (let i = 0; i < 10; i++) {
            setTimeout(createNameFlower, i * 150);
        }
        for (let i = 0; i < 20; i++) {
            setTimeout(createSparkle, i * 100);
        }
        for (let i = 0; i < 15; i++) {
            setTimeout(createFloatingHeart, i * 150);
        }
    </script>
</body>
</html>
